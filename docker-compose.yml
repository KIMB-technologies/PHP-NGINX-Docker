services:
  web:
    image: kimbtechnologies/php_nginx:latest
    container_name: php_nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      # mount the web root with PHP into the container, provide your PHP app here
      - ./php/:/php-code/ 
      # customize the NGINX config
      #    at the server {} block level 
      #- ./nginx/more-server-conf.conf:/etc/nginx/more-server-conf.conf:ro
      #    at the http {} block level
      #- ./nginx/more-http-conf.conf:/etc/nginx/more-http-conf.conf:ro
      #    at the root config level
      #- ./nginx/more-root-conf.conf:/etc/nginx/more-root-conf.conf:ro
      # define a sh script to be run before php and NGINX start (e.g. for system setups, ...; runs as root)
      #- ./startup-before.sh:/startup-before.sh:ro
    restart: unless-stopped