user                            www-data;
worker_processes                auto; # it will be determinate automatically by the number of core

error_log                       /var/log/nginx/error.log warn;

events {
	worker_connections          1024;
}

include more-root-conf.conf;

http {
	include                     /etc/nginx/mime.types;
	default_type                application/octet-stream;
	sendfile                    on;
	keepalive_timeout           3000;
	server_tokens               off;

	include more-http-conf.conf;

	# the main server, use on the outside
	server {
		listen 80;

		# answer any host names
		server_name _;

		# log only errors
		error_log /dev/stderr;
		access_log /dev/stdout;

		# the php-code folder
		root /php-code/;

		# php or html
		index index.php index.html;

		# custom server conf
		include more-server-conf.conf;

		# run all .php files, we a an import, s.t., file can be changed easily
		include process-php.conf;
	}

	# this is an internal server for the health check
	server {
		listen 127.0.0.1:9001;
		access_log off;

		location = /healthz {
			fastcgi_pass 127.0.0.1:9000;

			include fastcgi_params;
			
			fastcgi_param SCRIPT_NAME /healthz;
			fastcgi_param SCRIPT_FILENAME /healthz;
		}
	}
}
